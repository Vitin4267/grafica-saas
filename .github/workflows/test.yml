name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: grafica_saas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/grafica_saas_test?schema=public
      # Chave só de CI, sem relação com a de produção — o Postgres deste job é
      # descartado ao final, então não tem segredo real pra proteger aqui,
      # só precisa satisfazer src/lib/cripto.ts pros testes de cifrar/decifrar
      # (achado ao abrir o PR #8, 2026-09-14: CI nunca tinha rodado testes que
      # tocam cripto.ts antes desta branch).
      ENCRYPTION_KEY: B4SkFfk7cy8Cv633i/pe36o3aHDUP91VTYi0rJFb+GE=

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Achado da auditoria de segurança 2026-09-17: CI nunca rodava lint,
      # então erro acumulava sem ninguém notar (28 erros pré-existentes até
      # essa data, corrigidos na mesma sessão). Roda antes da suíte de
      # testes (não depende do Postgres do job, falha rápido).
      - run: npm run lint

      - run: npx prisma migrate deploy

      - run: npm test

  sast:
    runs-on: ubuntu-latest
    # Achado da auditoria de segurança 2026-09-17: nenhuma análise estática
    # de segurança rodava no CI. Semgrep via imagem oficial (não uma Action
    # de terceiro com versão própria pra manter atualizada) com rulesets
    # públicos — não precisa de conta/token do Semgrep. --error faz o job
    # falhar se achar algo, pra não virar um scan que ninguém olha.
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v7
      - run: >-
          semgrep scan --error
          --config=p/security-audit
          --config=p/owasp-top-ten
          --config=p/typescript
          --config=p/react
