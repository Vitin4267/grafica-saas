name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: grafica_saas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/grafica_saas_test?schema=public
      # Chave só de CI, sem relação com a de produção — o Postgres deste job é
      # descartado ao final, então não tem segredo real pra proteger aqui,
      # só precisa satisfazer src/lib/cripto.ts pros testes de cifrar/decifrar
      # (achado ao abrir o PR #8, 2026-09-14: CI nunca tinha rodado testes que
      # tocam cripto.ts antes desta branch).
      ENCRYPTION_KEY: B4SkFfk7cy8Cv633i/pe36o3aHDUP91VTYi0rJFb+GE=
      # Achado da auditoria de segurança 2026-09-17 (Fase B/RLS): o
      # Postgres deste job roda como `postgres` (superuser), que ignora
      # RLS por padrão — sem um role restrito próprio, src/lib/rls.test.ts
      # passaria "verde" sem nunca testar a policy de verdade. Role criado
      # no step "Cria role restrito..." abaixo, mesmos privilégios do
      # `grafica_app` de produção (só CRUD, sem CREATE/ALTER/DROP TABLE).
      RLS_TEST_DATABASE_URL: postgresql://ci_app_restrito:ci_app_restrito@localhost:5432/grafica_saas_test?schema=public

    steps:
      # Achado do Semgrep (SAST, 2026-09-17): tag mutável (@v4) pode ser
      # repontada pelo dono da Action, abrindo brecha de supply-chain (já
      # aconteceu de verdade com trivy-action/kics-github-action). Pinado
      # no SHA completo que @v4 apontava em 2026-09-17 — Dependabot
      # (github-actions ecosystem, já configurado) mantém isso atualizado
      # sozinho daqui pra frente.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Achado da auditoria de segurança 2026-09-17: CI nunca rodava lint,
      # então erro acumulava sem ninguém notar (28 erros pré-existentes até
      # essa data, corrigidos na mesma sessão). Roda antes da suíte de
      # testes (não depende do Postgres do job, falha rápido).
      - run: npm run lint

      - run: npx prisma migrate deploy

      # Achado da auditoria de segurança 2026-09-17 (Fase B/RLS) — mesmos
      # privilégios do role `grafica_app` criado em produção (ver migration
      # de menor privilégio): só CRUD, sem DDL nem gerenciar role. Roda
      # DEPOIS do migrate deploy (as tabelas e as policies de RLS do piloto
      # já existem nesse ponto). ubuntu-latest já traz `psql`.
      - name: Cria role restrito pra testar RLS de verdade
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d grafica_saas_test -c "
            CREATE ROLE ci_app_restrito WITH LOGIN PASSWORD 'ci_app_restrito' NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION;
            GRANT USAGE ON SCHEMA public TO ci_app_restrito;
            GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO ci_app_restrito;
            GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO ci_app_restrito;
          "

      # DATABASE_URL sobrescrita SÓ pra este step (achado rodando o job de
      # verdade, 2026-09-17): `postgres` é superuser, e Postgres NUNCA
      # aplica RLS a superuser, mesmo com policy — os testes que usam o
      # client normal do app (prisma.cliente.findMany, etc.) passariam
      # "verde" sem a policy nunca ter chance de bloquear nada. Trocar pro
      # role restrito aqui replica exatamente produção (`grafica_app`).
      - run: npm test
        env:
          DATABASE_URL: postgresql://ci_app_restrito:ci_app_restrito@localhost:5432/grafica_saas_test?schema=public

  sast:
    runs-on: ubuntu-latest
    # Achado da auditoria de segurança 2026-09-17: nenhuma análise estática
    # de segurança rodava no CI. Semgrep via imagem oficial (não uma Action
    # de terceiro com versão própria pra manter atualizada) com rulesets
    # públicos — não precisa de conta/token do Semgrep. --error faz o job
    # falhar se achar algo, pra não virar um scan que ninguém olha.
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: >-
          semgrep scan --error
          --config=p/security-audit
          --config=p/owasp-top-ten
          --config=p/typescript
          --config=p/react
